name: shrine_tours
description: ShrineTours - A travel itinerary planning app
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_bloc: ^8.1.3
  equatable: ^2.0.5
  go_router: ^13.0.0
  get_it: ^7.6.4
  google_fonts: ^5.1.0
  cached_network_image: ^3.3.0
  intl: ^0.19.0
  flutter_svg: ^2.0.9
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0
  image_picker: ^1.0.7
  shared_preferences: ^2.2.2
  pin_code_fields: ^8.0.1
  dartz: ^0.10.1
  google_sign_in: ^6.2.0
  razorpay_flutter: ^1.4.0
  # google_maps_flutter: ^2.5.0
  # geolocator: ^10.1.0
  # flutter_polyline_points: ^2.0.0
  path_provider: ^2.1.4
  open_file: ^3.3.2
  #pinput: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/fonts/

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
        - asset: assets/fonts/Inter-ExtraBold.ttf
          weight: 800
